version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: loan_processing_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=loan_agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loan_processing_backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/loan_agent_db}
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:

